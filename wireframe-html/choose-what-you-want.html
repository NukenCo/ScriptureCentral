<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ScriptureCentral — What brings you here?</title>
  <link rel="stylesheet" href="../design/tokens.css" />

<body>
  <main class="app-frame app-frame--onboarding">

    <div class="onboarding-header">
      <a class="icon-btn icon-btn--sm icon-btn--surface" href="choose-language.html" aria-label="Voltar">
        <span class="icon icon--20">
          <img src="assets/icons/arrow-left-a.svg" alt="" class="icon-layer" style="inset: 50% 20.83% 50% 20.83%;" />
          <img src="assets/icons/arrow-left-b.svg" alt="" class="icon-layer" style="inset: 20.83% 50% 20.83% 20.83%;" />

    <div class="onboarding-title">
      <h1>What brings you here today?</h1>
      <p>Select multiple</p>

      <span class="chip">I want to read the Bible</span>

      <span class="chip">Other</span>

    <div class="onboarding-bottom">
      <a class="btn-social" href="choose-familiarity.html">Next</a>
