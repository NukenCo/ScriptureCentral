<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="assets/js/gate.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ScriptureCentral — Start your reading plan</title>
  <link rel="stylesheet" href="../design/tokens.css" />
  <link rel="stylesheet" href="./styles.css" />
  <style>
    /* Chegada nessa página: fade in suave, sem o slide horizontal padrão. */
    ::view-transition-new(root) {
      animation-name: vt-fade-in;
      animation-timing-function: var(--ease-decelerate);
      animation-duration: var(--duration-page);
    }
    @keyframes vt-fade-in {
      from { transform: translateY(6px); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="login-plan-page">
    <div class="login-overlay__header">
      <img class="login-overlay__logo" src="assets/icons/logo-full.svg" alt="ScriptureCentral" />
      <button class="icon-btn icon-btn--surface" id="loginPlanClose" aria-label="Fechar" type="button">
        <span class="icon icon--20">
          <img src="assets/icons/close-a.svg" alt="" class="icon-layer" style="inset: 25%;" />
          <img src="assets/icons/close-b.svg" alt="" class="icon-layer" style="inset: 25%;" />
        </span>
      </button>
    </div>

    <div class="action-sheet">
      <div class="action-sheet__badge">
        <span class="icon icon--20">
          <img src="assets/icons/list-24-line.svg" alt="" class="icon-layer" style="inset: 25% 12.5% 75% 33.33%;" />
          <img src="assets/icons/list-24-line.svg" alt="" class="icon-layer" style="inset: 50% 12.5% 50% 33.33%;" />
          <img src="assets/icons/list-24-line.svg" alt="" class="icon-layer" style="inset: 75% 12.5% 25% 33.33%;" />
          <img src="assets/icons/list-24-dot.svg" alt="" class="icon-layer" style="inset: 25% 87.46% 75% 12.5%;" />
          <img src="assets/icons/list-24-dot.svg" alt="" class="icon-layer" style="inset: 50% 87.46% 50% 12.5%;" />
          <img src="assets/icons/list-24-dot.svg" alt="" class="icon-layer" style="inset: 75% 87.46% 25% 12.5%;" />
        </span>
      </div>

      <div class="action-sheet__title">
        <h2>Start your reading plan</h2>
        <p>Sign in or create an account to start reading and track your journey.</p>
      </div>

      <div class="action-sheet__buttons">
        <a class="btn-social" href="choose-language.html">
          <img src="assets/icons/google.svg" alt="" width="16" height="16" />
          Login with Google
        </a>
        <a class="btn-social" href="choose-language.html">
          <img src="assets/icons/facebook.svg" alt="" width="16" height="16" />
          Login with Facebook
        </a>
        <a class="btn-social" href="choose-language.html">
          <img src="assets/icons/apple.svg" alt="" width="12" height="15" />
          Login with Apple
        </a>
        <a class="btn-social" href="choose-language.html">
          <span class="icon icon--16">
            <img src="assets/icons/mail-a.svg" alt="" class="icon-layer" style="inset: 16.67% 8.33%;" />
            <img src="assets/icons/mail-b.svg" alt="" class="icon-layer" style="inset: 25% 8.33% 45.83% 8.33%;" />
          </span>
          Login with your e-mail
        </a>
      </div>

      <p class="action-sheet__signup">Already have an account? <strong>Sign in here</strong></p>
      <p class="action-sheet__legal">By signing up, you agree to our Terms<br />and Privacy Policy.</p>
    </div>
  </div>

  <script>
    (function () {
      var closeBtn = document.getElementById('loginPlanClose');
      closeBtn.addEventListener('click', function () {
        if (document.referrer && new URL(document.referrer).origin === location.origin) {
          history.back();
        } else {
          location.href = 'index.html';
        }
      });
    })();
  </script>
</body>
</html>
