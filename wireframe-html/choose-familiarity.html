<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ScriptureCentral — Choose familiarity</title>
  <link rel="stylesheet" href="../design/tokens.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app-frame">

    <div class="onboarding-header">
      <a class="icon-btn icon-btn--sm icon-btn--surface" href="choose-what-you-want.html" aria-label="Voltar">
        <span class="icon icon--20">
          <img src="assets/icons/arrow-left-a.svg" alt="" class="icon-layer" style="inset: 50% 20.83% 50% 20.83%;" />
          <img src="assets/icons/arrow-left-b.svg" alt="" class="icon-layer" style="inset: 20.83% 50% 20.83% 20.83%;" />
        </span>
      </a>
    </div>

    <div class="onboarding-title">
      <h1>What is your level of familiarity with the Bible?</h1>
      <p>An option</p>
    </div>

    <div class="chip-row chip-row--wrap">
      <span class="chip">I am new to the Bible</span>
      <span class="chip">Reasonably familiar</span>
      <span class="chip">Very familiar</span>
    </div>

    <p class="onboarding-helper">Wherever you are on your faith journey, there is a place for you here.</p>

    <footer class="bottom">
      <div class="onboarding-actions">
        <a class="btn-social" href="home-logged-in.html">Next</a>
        <a class="onboarding-skip" href="home-logged-in.html">Skip</a>
      </div>
    </footer>

  </main>
</body>
</html>
