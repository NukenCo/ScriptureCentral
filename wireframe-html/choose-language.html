<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ScriptureCentral — Choose language</title>
  <link rel="stylesheet" href="../design/tokens.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app-frame app-frame--onboarding">

    <div class="onboarding-title" style="padding-top: var(--space-4);">
      <h1>Which language do you prefer?</h1>
      <p>Over 60 languages</p>
    </div>

    <div class="search-row">
      <button class="pill-icon-btn" type="button" aria-label="Buscar idioma">
        <span class="icon icon--20">
          <img src="assets/icons/search-a.svg" alt="" class="icon-layer" style="inset: 12.5% 20.83% 20.83% 12.5%;" />
          <img src="assets/icons/search-b.svg" alt="" class="icon-layer" style="inset: 69.37% 12.5% 12.5% 69.37%;" />
        </span>
      </button>
      <div class="search-field">Find your language</div>
    </div>

    <div class="chip-row chip-row--wrap">
      <span class="chip">English</span>
      <span class="chip">English-UK</span>
      <span class="chip">France</span>
      <span class="chip">Portuguese</span>
      <span class="chip">Deutch</span>
      <span class="chip">Hebraic</span>
      <span class="chip">Korean</span>
      <span class="chip">Hebraic</span>
      <span class="chip">Chinese</span>
    </div>

    <div class="onboarding-bottom">
      <a class="btn-social" href="choose-what-you-want.html">Next</a>
      <a class="onboarding-skip" href="home-logged-in.html">Skip</a>
    </div>

  </main>
</body>
</html>
