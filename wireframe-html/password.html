<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ScriptureCentral — Welcome</title>
  <link rel="stylesheet" href="../design/tokens.css" />
  <link rel="stylesheet" href="./styles.css" />
  <style>
    /* Primeira tela que o cliente vê: fade in suave, sem o slide padrão. */
    ::view-transition-new(root) {
      animation-name: vt-fade-in;
      animation-timing-function: var(--ease-decelerate);
      animation-duration: var(--duration-page);
    }
    @keyframes vt-fade-in {
      from { transform: translateY(6px); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="password-page">
    <div class="password-page__header">
      <img class="login-overlay__logo" src="assets/icons/logo-full.svg" alt="ScriptureCentral" />
    </div>

    <div class="password-page__card">
      <div class="password-page__title">
        <h1>Welcome!</h1>
        <p>UX/UI &bull; Wireframe Prototype</p>
      </div>

      <form class="password-page__form" id="passwordForm" autocomplete="off">
        <input
          type="password"
          id="passwordInput"
          class="password-page__input"
          placeholder="Password"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
        />
        <button class="password-page__submit" type="submit" aria-label="Entrar">
          <span class="icon icon--24">
            <img src="assets/icons/arrow-right-a.svg" alt="" class="icon-layer" style="inset: 50% 20.83% 50% 20.83%;" />
            <img src="assets/icons/arrow-right-b.svg" alt="" class="icon-layer" style="inset: 20.83% 20.83% 20.83% 50%;" />
          </span>
        </button>
      </form>

      <p class="password-page__error" id="passwordError" hidden>Incorrect password. Please try again.</p>
    </div>
  </div>

  <script>
    (function () {
      var PASSWORD = 'scripturecentral@2026';
      var UNLOCK_KEY = 'sc_unlocked';
      var form = document.getElementById('passwordForm');
      var input = document.getElementById('passwordInput');
      var error = document.getElementById('passwordError');

      var params = new URLSearchParams(location.search);
      var next = params.get('next') || 'index.html';
      // Só aceita um caminho relativo do próprio site (pode ter querystring,
      // ex: "index.html?login=1") — nunca redireciona pra outra origem a
      // partir de um parâmetro de URL.
      if (next.indexOf('//') === 0 || next.indexOf(':') !== -1) {
        next = 'index.html';
      }

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        if (input.value === PASSWORD) {
          try {
            localStorage.setItem(UNLOCK_KEY, '1');
          } catch (e) {}
          location.href = next;
          return;
        }
        error.hidden = false;
        input.focus();
        input.select();
      });

      input.addEventListener('input', function () {
        if (!error.hidden) error.hidden = true;
      });
    })();
  </script>
</body>
</html>
